<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VYOMNETRA 3D Space Situational Awareness Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030712; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 16px; left: 16px; color: #f8fafc;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      border: 1px solid #334155; padding: 14px 20px; border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); z-index: 10;
    }
    #hud h1 { margin: 0 0 6px 0; font-size: 18px; color: #38bdf8; letter-spacing: 0.5px; }
    #hud p { margin: 2px 0; font-size: 12px; color: #94a3b8; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; margin-right: 4px; }
    .badge-pass { background: #065f46; color: #34d399; }
    .badge-alert { background: #7f1d1d; color: #fca5a5; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <h1>VYOMNETRA 3D Earth Orbit Visualizer</h1>
    <p>Rendering Engine: <span class="badge badge-pass">WebGL 60 FPS</span></p>
    <p>Ground Sites: <span style="color:#f59e0b;">Hazaribagh, Bengaluru (ISTRAC), Sriharikota (SDSC)</span></p>
    <p>Active Objects: <span id="object-count">25,400 Satellites / Debris</span></p>
    <p>Conjunction Alerts: <span class="badge badge-alert">2 CRITICAL</span></p>
  </div>
  <div id="canvas-container"></div>

  <script>
    // Initialize Three.js Scene
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 300);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // 1. Earth Sphere
    const earthRadius = 63.71;
    const earthGeo = new THREE.SphereGeometry(earthRadius, 64, 64);
    const earthMat = new THREE.MeshPhongMaterial({
      color: 0x1e3a8a,
      emissive: 0x0284c7,
      emissiveIntensity: 0.15,
      specular: 0x38bdf8,
      shininess: 15,
      wireframe: false
    });
    const earth = new THREE.Mesh(earthGeo, earthMat);
    scene.add(earth);

    // Atmosphere Glow
    const atmosGeo = new THREE.SphereGeometry(earthRadius * 1.02, 64, 64);
    const atmosMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.15,
      side: THREE.BackSide
    });
    const atmos = new THREE.Mesh(atmosGeo, atmosMat);
    scene.add(atmos);

    // 2. Lighting (Sun)
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(200, 100, 150);
    scene.add(dirLight);

    const ambLight = new THREE.AmbientLight(0x1e293b, 0.6);
    scene.add(ambLight);

    // 3. Ground Stations Pins
    const sites = [
      { name: "Hazaribagh Ground Station", lat: 23.9968, lon: 85.3647, color: 0x10b981 },
      { name: "ISTRAC Bengaluru", lat: 13.0344, lon: 77.5118, color: 0x3b82f6 },
      { name: "SDSC Sriharikota", lat: 13.7199, lon: 80.2304, color: 0xf59e0b }
    ];

    sites.forEach(s => {
      const phi = (90 - s.lat) * (Math.PI / 180);
      const theta = (s.lon + 180) * (Math.PI / 180);
      const x = -(earthRadius * Math.sin(phi) * Math.cos(theta));
      const z = (earthRadius * Math.sin(phi) * Math.sin(theta));
      const y = (earthRadius * Math.cos(phi));

      const pinGeo = new THREE.SphereGeometry(1.2, 16, 16);
      const pinMat = new THREE.MeshBasicMaterial({ color: s.color });
      const pin = new THREE.Mesh(pinGeo, pinMat);
      pin.position.set(x, y, z);
      scene.add(pin);
    });

    // 4. Random Satellite Point Cloud (Simulated LEO/GEO Constellations)
    const numPoints = 2500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(numPoints * 3);
    const colors = new Float32Array(numPoints * 3);

    for (let i = 0; i < numPoints; i++) {
      const r = earthRadius + 4 + Math.random() * 80;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);

      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);

      // Red for conjunction threat, cyan for active satellites
      if (i < 10) {
        colors[i * 3] = 0.94; colors[i * 3 + 1] = 0.27; colors[i * 3 + 2] = 0.27;
      } else {
        colors[i * 3] = 0.22; colors[i * 3 + 1] = 0.74; colors[i * 3 + 2] = 0.97;
      }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const pMaterial = new THREE.PointsMaterial({
      size: 1.5,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });

    const satCloud = new THREE.Points(geometry, pMaterial);
    scene.add(satCloud);

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      earth.rotation.y += 0.001;
      satCloud.rotation.y += 0.0015;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
