name: VYOMNETRA CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run SQLite Database Ingest Verification
        run: |
          python scripts/verify_ingest.py

      - name: Run Full Test Suite & Coverage
        run: |
          pytest --verbose --cov=vyomnetra

      - name: Build Docker Container
        run: |
          docker build -t vyomnetra-ssa:latest .
