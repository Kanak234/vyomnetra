version: '3.8'

services:
  vyomnetra-api:
    build: .
    container_name: vyomnetra_api
    ports:
      - "8000:8000"
    environment:
      - VYOMNETRA_ENV=production
      - VYOMNETRA_LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - vyomnetra_data:/home/kanak/.gemini/antigravity
    depends_on:
      - redis
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: vyomnetra_redis
    ports:
      - "6379:6379"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: vyomnetra_nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vyomnetra-api
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: vyomnetra_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: vyomnetra_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards
    restart: always

volumes:
  vyomnetra_data:
